<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>HarbuZoo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a2e">
<meta name="description" content="HarbuZoo - pixelart match-3 dyrespil i vanvittig japansk stil.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HarbuZoo">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23120a2e'/%3E%3Ccircle cx='90' cy='100' r='56' fill='%23e8334a'/%3E%3Ctext x='90' y='122' font-size='72' text-anchor='middle'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<!-- Pixelfont (valgfri – spillet virker også uden) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --ink: #1b1030;
    --cream: #fff3d6;
    --red: #e8334a;
    --gold: #ffd23f;
    --pink: #ff9db5;
    --cyan: #36e0ff;
    --lime: #9dff4a;
    --panel: #2a1a52;
    --panel2: #35216a;
    --cs: 40px;
    --sp: 36px;
    --font: "Press Start 2P", ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
    background: #120a2e; color: var(--cream);
    font-family: var(--font); font-size: 10px; line-height: 1.5;
    -webkit-user-select: none; user-select: none;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .petal {
    position: absolute; top: -12px; width: 6px; height: 6px; background: var(--pink);
    box-shadow: 2px 2px 0 rgba(0,0,0,.25); opacity: .85;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0,0); }
    50%  { transform: translate(28px, 55vh); }
    100% { transform: translate(-10px, 112vh); }
  }

  .app {
    position: relative; z-index: 2;
    width: 100%; max-width: 440px; height: 100%; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);
  }

  /* ---------- Topbar ---------- */
  header { width: 100%; display: flex; align-items: center; gap: 8px; }
  .mascot { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
  .mascot.hop { animation: hop .35s steps(4); }
  @keyframes hop { 40% { transform: translateY(-8px) rotate(-6deg); } 100% { transform: none; } }
  .hd { min-width: 0; }
  .brand { font-size: 14px; color: var(--cream); text-shadow: 2px 2px 0 var(--ink), 0 0 0 var(--ink); letter-spacing: 1px; white-space: nowrap; }
  .brand span { color: var(--red); }
  .bubble {
    margin-top: 4px; display: inline-block; max-width: 190px;
    background: var(--cream); color: var(--ink); font-size: 7px; padding: 4px 6px;
    border: 2px solid var(--ink); box-shadow: 2px 2px 0 rgba(0,0,0,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spacer { flex: 1; }
  .pbtn {
    font-family: var(--font); color: var(--cream); cursor: pointer;
    background: var(--panel2); border: 3px solid var(--ink);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 4px 0 var(--ink);
  }
  .pbtn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 1px 0 var(--ink); }
  .pbtn.sq { width: 38px; height: 38px; font-size: 14px; padding: 0; line-height: 1; }
  .pbtn[aria-pressed="false"] { opacity: .5; }

  /* ---------- Stats ---------- */
  .stats { width: 100%; display: flex; gap: 8px; margin: 12px 0 8px; }
  .stat {
    flex: 1; text-align: center; padding: 7px 4px 6px;
    background: var(--panel); border: 3px solid var(--ink);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 3px 0 var(--ink);
  }
  .stat b { display: block; font-size: 13px; font-weight: normal; color: var(--gold); }
  .stat i { font-style: normal; font-size: 6px; letter-spacing: 1px; color: var(--pink); }

  .timer {
    width: 100%; height: 14px; background: var(--ink); border: 3px solid var(--ink);
    box-shadow: 0 0 0 2px rgba(255,255,255,.16); padding: 0;
  }
  #timerFill {
    height: 100%; width: 100%;
    background: repeating-linear-gradient(90deg, var(--lime) 0 6px, transparent 6px 8px);
  }
  .timer.low #timerFill { background: repeating-linear-gradient(90deg, var(--red) 0 6px, transparent 6px 8px); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .5; } }

  /* ---------- Bræt ---------- */
  .board-wrap { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #board {
    position: relative; box-sizing: content-box;
    width: calc(var(--cs) * 8); height: calc(var(--cs) * 8);
    border: 4px solid var(--red);
    box-shadow: 0 0 0 3px var(--ink), 0 6px 0 3px var(--ink), inset 0 0 0 2px rgba(0,0,0,.35);
    background-color: #241845;
    background-image: conic-gradient(#2d1f55 25%, #231745 0 50%, #2d1f55 0 75%, #231745 0);
    background-size: calc(var(--cs) * 2) calc(var(--cs) * 2);
    touch-action: none;
  }
  #board.shake { animation: bshake .3s steps(6); }
  @keyframes bshake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-2px); } 80% { transform: translate(3px, 2px); } }

  .tile {
    position: absolute; top: 0; left: 0; width: var(--cs); height: var(--cs);
    display: grid; place-items: center; z-index: 2; will-change: transform;
    transition: transform .17s cubic-bezier(.3,.9,.4,1);
  }
  .tile > i {
    position: relative; display: block;
    width: calc(var(--cs) - 6px); height: calc(var(--cs) - 6px);
    background-repeat: no-repeat; background-position: center; background-size: var(--sp) var(--sp);
    image-rendering: pixelated;
    transition: transform .15s steps(3), opacity .18s steps(3);
  }
  .t0 { background-image: var(--s0); } .t1 { background-image: var(--s1); } .t2 { background-image: var(--s2); }
  .t3 { background-image: var(--s3); } .t4 { background-image: var(--s4); } .t5 { background-image: var(--s5); }
  .t6 { background-image: var(--s6); }

  /* Specialbrikker */
  .tile > i[class*="sp-"]::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-repeat: no-repeat; background-position: center; background-size: var(--sp) var(--sp);
    image-rendering: pixelated;
  }
  .sp-row::after  { background-image: var(--ic-row); }
  .sp-col::after  { background-image: var(--ic-col); }
  .sp-bomb::after { background-image: var(--ic-bomb); }
  .sp-row, .sp-col, .sp-bomb { outline: 2px solid var(--glow); outline-offset: -1px; animation: glow .7s steps(2) infinite; }
  .sp-row  { --glow: var(--cyan); }
  .sp-col  { --glow: var(--lime); }
  .sp-bomb { --glow: var(--red); }
  @keyframes glow { 50% { outline-color: #fff; filter: brightness(1.35); } }
  .sp-rainbow { background-image: var(--orb); animation: hue 1.1s steps(8) infinite, bob .6s steps(2) infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  @keyframes bob { 50% { transform: scale(1.1); } }
  .born { animation: born .35s steps(5); }
  @keyframes born { 0% { transform: scale(2.2); filter: brightness(3); } 100% { transform: none; } }

  .tile.sel > i { transform: scale(1.12); outline: 3px solid var(--gold); outline-offset: -1px; }
  .tile.hint > i { animation: hint .6s steps(2) infinite; }
  @keyframes hint { 50% { transform: scale(1.14); } }
  .tile.pop > i { transform: scale(.2) rotate(25deg); opacity: 0; }
  .tile.bad { animation: shake .26s steps(4); }
  @keyframes shake { 25% { margin-left: -4px; } 75% { margin-left: 4px; } }

  .fx {
    position: absolute; pointer-events: none; z-index: 5; text-align: center; white-space: nowrap;
    font-size: 9px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink);
    animation: fx .8s steps(8) forwards;
  }
  @keyframes fx { to { transform: translateY(-34px); opacity: 0; } }

  .beam { position: absolute; pointer-events: none; z-index: 4; animation: beam .45s steps(6) forwards; }
  .beam.h { background: linear-gradient(var(--cyan), #fff, var(--cyan)); }
  .beam.v { background: linear-gradient(90deg, var(--lime), #fff, var(--lime)); }
  @keyframes beam { 0% { opacity: 1; } 100% { opacity: 0; transform: scale(1, .2); } }
  .beam.v { animation-name: beamv; }
  @keyframes beamv { 0% { opacity: 1; } 100% { opacity: 0; transform: scale(.2, 1); } }
  .ring {
    position: absolute; pointer-events: none; z-index: 4; border: 4px solid var(--gold);
    background: rgba(232,51,74,.45); animation: ring .5s steps(6) forwards;
  }
  @keyframes ring { 0% { transform: translate(-50%,-50%) rotate(45deg) scale(.2); opacity: 1; } 100% { transform: translate(-50%,-50%) rotate(45deg) scale(1); opacity: 0; } }

  /* ---------- Shuffle ---------- */
  .bottom { width: 100%; display: flex; align-items: center; gap: 10px; padding-top: 10px; }
  #shuffleBtn { flex: none; padding: 11px 12px; font-size: 10px; background: var(--red); display: flex; align-items: center; gap: 8px; }
  #shuffleBtn b { background: var(--ink); color: var(--gold); padding: 3px 6px; font-weight: normal; }
  #shuffleBtn:disabled { filter: grayscale(1); opacity: .5; }
  .small { font-size: 7px; color: var(--cream); text-shadow: 1px 1px 0 var(--ink); line-height: 1.7; }

  /* ---------- Overlay ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px;
    background: rgba(10,5,28,.82);
  }
  #overlay[hidden] { display: none; }
  .card {
    width: 100%; max-width: 360px; text-align: center; padding: 18px 16px 18px;
    background: var(--panel); border: 4px solid var(--ink);
    box-shadow: inset 0 0 0 3px var(--red), 0 6px 0 var(--ink);
  }
  .card canvas { width: 72px; height: 72px; image-rendering: pixelated; }
  .card h1 { margin: 8px 0 2px; font-size: 18px; font-weight: normal; text-shadow: 3px 3px 0 var(--ink); }
  .card h1 span { color: var(--red); }
  .jp { font-size: 10px; color: var(--pink); margin-bottom: 12px; font-family: "Hiragino Sans", "Noto Sans JP", var(--font); }
  .big { font-size: 26px; color: var(--gold); margin: 6px 0 10px; text-shadow: 3px 3px 0 var(--ink); }
  .rules { text-align: left; font-size: 7px; line-height: 2; margin: 0 0 14px; font-family: var(--font); }
  .rules p { margin: 0 0 6px; }
  .rules b { font-weight: normal; }
  .c1 { color: var(--cyan); } .c2 { color: var(--red); } .c3 { color: var(--gold); } .c4 { color: var(--lime); }
  button.play {
    width: 100%; padding: 14px 8px; font-size: 12px; color: var(--ink);
    background: var(--gold); border: 3px solid var(--ink); cursor: pointer; font-family: var(--font);
    box-shadow: inset 0 0 0 2px #fff6, 0 4px 0 var(--ink);
  }
  button.play:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px #fff6, 0 1px 0 var(--ink); }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="petals"></div>

<div class="app">
  <header>
    <canvas id="mascot" class="mascot" width="36" height="36"></canvas>
    <div class="hd">
      <div class="brand">HARBU<span>ZOO</span></div>
      <div class="bubble" id="bubble">GANBATTE!</div>
    </div>
    <div class="spacer"></div>
    <button class="pbtn sq" id="soundBtn" aria-pressed="true" title="Lyd">&#9834;</button>
    <button class="pbtn sq" id="restartBtn" title="Nyt spil">&#8635;</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="score">0</b><i>POINT</i></div>
    <div class="stat"><b id="level">1</b><i>LEVEL</i></div>
    <div class="stat"><b id="best">0</b><i>REKORD</i></div>
  </div>

  <div class="timer" id="timer"><div id="timerFill"></div></div>

  <div class="board-wrap" id="wrap"><div id="board"></div></div>

  <div class="bottom">
    <button class="pbtn" id="shuffleBtn">SHUFFLE <b id="shufN">2</b></button>
    <div class="small" id="shufHint">+1 ved 1000 point</div>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <canvas id="bigMascot" width="72" height="72"></canvas>
    <h1 id="ovTitle">HARBU<span>ZOO</span></h1>
    <div class="jp" id="ovJp">どうぶつパズル</div>
    <div class="big" id="ovScore" hidden>0</div>
    <div class="rules" id="ovText">
      <p>Byt to naboer. 3 p&aring; stribe forsvinder.</p>
      <p><b class="c1">4 i tr&aelig;k</b> = KATANA, rydder r&aelig;kke eller kolonne.</p>
      <p><b class="c2">L eller T</b> = BAKUDAN, sprænger et omr&aring;de.</p>
      <p><b class="c3">5 i tr&aelig;k</b> = NIJI. Byt den med et dyr og fjern dem alle.</p>
    </div>
    <button class="play" id="playBtn">START!</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ====================== Konstanter ======================
  var SIZE = 8;
  var TYPES = 7;                 // neko, tanuki, kitsune, panda, kappa, tako, hiyoko
  var TIME_MAX = 60, TIME_START = 42, TIME_PER_TILE = 0.5;
  var LEVEL_STEP = 1200;
  var SHUFFLE_START = 2, SHUFFLE_EVERY = 1000, SHUFFLE_CAP = 9;
  var SWAP_MS = 170, POP_MS = 220, FALL_MS = 210;

  // ====================== Pixelart (12x12) ======================
  var SPRITES = [
    { // 0 Maneki-neko
      pal: { K:'#2a1a2e', W:'#fffaf0', P:'#ff9db5', R:'#e8334a', Y:'#ffd23f', O:'#f5a04a' },
      rows: [
        '.KK......KK.',
        'KPPK....KPPK',
        'KPWWKKKKWWPK',
        'KWWWWWWWWWWK',
        'KWWKWWWWKWWK',
        'KOWKWWWWKWOK',
        'KWWWWPPWWWWK',
        '.KWWWKKWWWK.',
        '..KKWWWWKK..',
        '.KRRRRRRRRK.',
        '..KRRYYRRK..',
        '...KKKKKK...']
    },
    { // 1 Tanuki
      pal: { K:'#2a1a2e', B:'#9a6330', D:'#3b2314', C:'#ecd7ab', G:'#4cc66a', W:'#ffffff' },
      rows: [
        '....KGGK....',
        '.KK.KGGK.KK.',
        'KBBKBBBBKBBK',
        'KBBBBBBBBBBK',
        'KBDDBBBBDDBK',
        'KBDWDBBDWDBK',
        'KBBCCDDCCBBK',
        '.KBCCCCCCBK.',
        '..KBBBBBBK..',
        '...KBBBBK...',
        '..KBBBBBBK..',
        '...KKKKKK...']
    },
    { // 2 Kitsune
      pal: { K:'#2a1a2e', O:'#ff7a1a', W:'#fff6e8', D:'#3b1a10' },
      rows: [
        'KK........KK',
        'KOK......KOK',
        'KOOK....KOOK',
        'KOOOKKKKOOOK',
        'KOOOOOOOOOOK',
        'KOKKOOOOKKOK',
        'KWOOOOOOOOWK',
        'KWWWOOOOWWWK',
        '.KWWWDDWWWK.',
        '..KWWWWWWK..',
        '...KWWWWK...',
        '....KKKK....']
    },
    { // 3 Panda
      pal: { K:'#1a1a24', N:'#3a3a4a', W:'#ffffff' },
      rows: [
        'KKK......KKK',
        'KKKK....KKKK',
        'NKKWWWWWWKKN',
        'NWWWWWWWWWWN',
        'NWKKKWWKKKWN',
        'NWKWKWWKWKWN',
        'NWKKKWWKKKWN',
        'NWWWWKKWWWWN',
        'NWWWKWWKWWWN',
        '.NWWWKKWWWN.',
        '..NNWWWWNN..',
        '....NNNN....']
    },
    { // 4 Kappa
      pal: { K:'#12301e', G:'#3fbf6a', D:'#1f7a42', Y:'#ffd23f', C:'#7fe3ff', W:'#ffffff' },
      rows: [
        '...KKKKKK...',
        '..KCCCCCCK..',
        '.KGKKKKKKGK.',
        'KGGGGGGGGGGK',
        'KGWWWGGWWWGK',
        'KGWKWGGWKWGK',
        'KGGGGGGGGGGK',
        'KGYYYYYYYYGK',
        '.KYYYYYYYYK.',
        '..KGDDDDGK..',
        '...KDDDDK...',
        '....KKKK....']
    },
    { // 5 Tako
      pal: { K:'#26103f', P:'#a259e0', L:'#d2a6ff', W:'#ffffff', C:'#ff9db5' },
      rows: [
        '...KKKKKK...',
        '..KPPPPPPK..',
        '.KPLLPPPPPK.',
        'KPPPPPPPPPPK',
        'KPWWPPPPWWPK',
        'KPWKPPPPKWPK',
        'KPCPPPPPPCPK',
        'KPPPPKKPPPPK',
        '.KPPPPPPPPK.',
        'KPKPKPPKPKPK',
        'PP.PP..PP.PP',
        'K..KK..KK..K']
    },
    { // 6 Hiyoko
      pal: { K:'#3a2a10', Y:'#ffe14a', O:'#ff8a1a', C:'#ff9d7a' },
      rows: [
        '.....KK.....',
        '....KYYK....',
        '...KYYYYK...',
        '..KYYYYYYK..',
        '.KYYYYYYYYK.',
        'KYYKYYYYKYYK',
        'KYYKYYYYKYYK',
        'KYCYYOOYYCYK',
        'KYYYYOOYYYYK',
        '.KYYYYYYYYK.',
        '..KKYYYYKK..',
        '...OO..OO...']
    }
  ];
  var INK = '#2a1a2e';

  function spriteCanvas(def, px, canvas) {
    var N = 12;
    var c = canvas || document.createElement('canvas');
    c.width = c.height = N * px;
    var g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        var ch = def.rows[y].charAt(x);
        if (ch === '.' || !def.pal[ch]) continue;
        g.fillStyle = def.pal[ch];
        g.fillRect(x * px, y * px, px, px);
      }
    }
    return c;
  }

  // Små pixel-tegninger bygget af punkter
  function plotCanvas(px, draw) {
    var N = 12, grid = {};
    function put(x, y, col) { if (x >= 0 && y >= 0 && x < N && y < N) grid[x + ',' + y] = col; }
    draw(put);
    var c = document.createElement('canvas');
    c.width = c.height = N * px;
    var g = c.getContext('2d');
    var keys = Object.keys(grid), k, p;
    var outline = {};
    keys.forEach(function (key) {                         // sort kant rundt om figuren
      p = key.split(',');
      var x = +p[0], y = +p[1];
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function (d) {
        var nk = (x + d[0]) + ',' + (y + d[1]);
        if (!grid[nk] && x + d[0] >= 0 && y + d[1] >= 0 && x + d[0] < N && y + d[1] < N) outline[nk] = 1;
      });
    });
    g.fillStyle = INK;
    Object.keys(outline).forEach(function (key) { p = key.split(','); g.fillRect(p[0] * px, p[1] * px, px, px); });
    keys.forEach(function (key) { p = key.split(','); g.fillStyle = grid[key]; g.fillRect(p[0] * px, p[1] * px, px, px); });
    return c;
  }
  function iconRow(px) {
    return plotCanvas(px, function (put) {
      var L = [[0,5],[0,6],[1,4],[1,5],[1,6],[1,7]];
      L.forEach(function (p) { put(p[0], p[1], '#36e0ff'); put(11 - p[0], p[1], '#36e0ff'); });
    });
  }
  function iconCol(px) {
    return plotCanvas(px, function (put) {
      var L = [[5,0],[6,0],[4,1],[5,1],[6,1],[7,1]];
      L.forEach(function (p) { put(p[0], p[1], '#9dff4a'); put(p[0], 11 - p[1], '#9dff4a'); });
    });
  }
  function iconBomb(px) {
    return plotCanvas(px, function (put) {
      [[9,1],[9,2],[9,3],[8,2],[10,2]].forEach(function (p) { put(p[0], p[1], '#ffd23f'); put(11 - p[0], 11 - p[1], '#ffd23f'); });
      put(9, 2, '#ffffff'); put(2, 9, '#ffffff');
    });
  }
  function orbCanvas(px) {
    var N = 12, c = document.createElement('canvas');
    c.width = c.height = N * px;
    var g = c.getContext('2d');
    var bands = ['#e8334a', '#ff8a1a', '#ffd23f', '#6bdc6a', '#36b6ff', '#a259e0'];
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var d = Math.sqrt((x - 5.5) * (x - 5.5) + (y - 5.5) * (y - 5.5));
      if (d <= 4.7) g.fillStyle = bands[Math.min(5, Math.floor(y / 2))];
      else if (d <= 5.7) g.fillStyle = INK;
      else continue;
      g.fillRect(x * px, y * px, px, px);
    }
    g.fillStyle = '#ffffff';
    [[3,3],[4,3],[3,4],[7,8]].forEach(function (p) { g.fillRect(p[0] * px, p[1] * px, px, px); });
    return c;
  }

      clear.forEach(function (i) { removeTile(board[i]); board[i] = null; });

      for (var c = 0; c < SIZE; c++) {
        var write = SIZE - 1, r;
        for (r = SIZE - 1; r >= 0; r--) {
          var t = board[idx(r, c)];
          if (!t) continue;
          if (r !== write) { board[idx(write, c)] = t; board[idx(r, c)] = null; t.r = write; t.c = c; }
          write--;
        }
        var spawn = 1;
        for (var r2 = write; r2 >= 0; r2--) {
          var nt = makeTile(randType(), -spawn, c);
          spawn++;
          nt.r = r2; nt.c = c;
          board[idx(r2, c)] = nt;
        }
      }
      void boardEl.offsetWidth;
      for (var i2 = 0; i2 < board.length; i2++) if (board[i2]) place(board[i2], true);
      await sleep(FALL_MS);
    }

    if (!findMove()) {
      say('KAWARI! SHUFFLE');
      await sleep(250);
      shuffleBoard();
      await sleep(FALL_MS + 60);
      await resolve();
    }
    return combo;
  }

  // ====================== Træk ======================
  async function trySwap(i, j) {
    if (busy || !running) return;
    busy = true;
    clearHint();
    idleSince = performance.now();

    var a = board[i], b = board[j];
    swapModel(i, j);
    place(a, true); place(b, true);
    await sleep(SWAP_MS);

    var forced = specialForce(a, b);
    if (!forced && findMatches().size === 0) {
      swapModel(i, j);
      place(a, true); place(b, true);
      a.el.classList.add('bad'); b.el.classList.add('bad');
      beep(150, .12, .05);
      timeLeft = Math.max(0, timeLeft - 1);
      await sleep(SWAP_MS + 60);
      a.el.classList.remove('bad'); b.el.classList.remove('bad');
    } else {
      await resolve(forced, [i, j]);
    }
    busy = false;
  }

  async function doShuffle() {
    if (busy || !running || shuffles <= 0) return;
    busy = true;
    shuffles--;
    updateShuffleUI();
    clearSelection(); clearHint();
    idleSince = performance.now();
    say('SHUFFLE!');
    arp([0, 3, 5, 8], 50);
    shuffleBoard();
    await sleep(FALL_MS + 80);
    if (findMatches().size) await resolve();
    busy = false;
  }

  function neighbors(i, j) {
    var r1 = Math.floor(i / SIZE), c1 = i % SIZE, r2 = Math.floor(j / SIZE), c2 = j % SIZE;
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  }

  // ====================== Input ======================
  var down = null;
  function cellFromEvent(e) {
    var rect = boardEl.getBoundingClientRect(), cs = cell();
    var c = Math.floor((e.clientX - rect.left - boardEl.clientLeft) / cs);
    var r = Math.floor((e.clientY - rect.top - boardEl.clientTop) / cs);
    if (r < 0 || c < 0 || r >= SIZE || c >= SIZE) return -1;
    return idx(r, c);
  }
  function select(i) {
    clearSelection();
    if (i >= 0 && board[i]) { selected = i; board[i].el.classList.add('sel'); }
  }
  function clearSelection() {
    if (selected !== null && board[selected]) board[selected].el.classList.remove('sel');
    selected = null;
  }
  boardEl.addEventListener('pointerdown', function (e) {
    if (!running || busy) return;
    var i = cellFromEvent(e);
    if (i < 0) return;
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
    down = { i: i, x: e.clientX, y: e.clientY, moved: false };
    if (selected === null) select(i);
    e.preventDefault();
  });
  boardEl.addEventListener('pointermove', function (e) {
    if (!down || down.moved || busy) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y, thresh = cell() * 0.45;
    if (Math.abs(dx) < thresh && Math.abs(dy) < thresh) return;
    down.moved = true;
    var r = Math.floor(down.i / SIZE), c = down.i % SIZE;
    if (Math.abs(dx) > Math.abs(dy)) c += dx > 0 ? 1 : -1; else r += dy > 0 ? 1 : -1;
    clearSelection();
    if (r >= 0 && c >= 0 && r < SIZE && c < SIZE) trySwap(down.i, idx(r, c));
    down = null;
  });
  boardEl.addEventListener('pointerup', function (e) {
    if (!down) return;
    var i = cellFromEvent(e);
    if (!down.moved) {
      if (selected !== null && selected !== i && i >= 0 && neighbors(selected, i)) {
        var from = selected; clearSelection(); trySwap(from, i);
      } else if (selected !== i) select(i);
    }
    down = null;
  });
  boardEl.addEventListener('pointercancel', function () { down = null; });

  // ====================== Hint ======================
  function clearHint() {
    hintTiles.forEach(function (t) { if (t && t.el) t.el.classList.remove('hint'); });
    hintTiles = [];
  }
  function showHint() {
    if (hintTiles.length || busy) return;
    var mv = findMove();
    if (!mv) return;
    hintTiles = [board[mv[0]], board[mv[1]]];
    hintTiles.forEach(function (t) { if (t && t.el) t.el.classList.add('hint'); });
  }

  // ====================== Loop ======================
  function loop(now) {
    requestAnimationFrame(loop);
    if (!running) return;
    if (!lastTick) lastTick = now;
    var dt = Math.min(0.25, (now - lastTick) / 1000);
    lastTick = now;
    if (!busy) {
      timeLeft -= dt * (1 + (level - 1) * 0.09);
      if (now - idleSince > 5000) showHint();
    }
    if (timeLeft <= 0) { timeLeft = 0; gameOver(); }
    var frac = timeLeft / TIME_MAX;
    fillEl.style.width = (frac * 100).toFixed(1) + '%';
    timerEl.classList.toggle('low', frac < 0.25);
  }
  requestAnimationFrame(loop);

  // ====================== Start / slut ======================
  function startGame() {
    score = 0; level = 1; timeLeft = TIME_START;
    shuffles = SHUFFLE_START; nextShuffleAt = SHUFFLE_EVERY;
    scoreEl.textContent = '0'; levelEl.textContent = '1';
    updateShuffleUI();
    clearSelection(); clearHint();
    busy = false;
    fillBoard();
    layout();
    overlay.hidden = true;
    running = true;
    lastTick = 0;
    idleSince = performance.now();
    say('HAJIME! START!');
    arp([0, 2, 4], 70);
  }
  function gameOver() {
    running = false;
    clearSelection(); clearHint();
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('harbuzoo.best', String(best)); } catch (e) {}
    }
    ovTitle.innerHTML = 'OWARI!';
    ovJp.textContent = '終わり';
    ovScore.hidden = false;
    ovScore.textContent = score;
    ovText.innerHTML = '<p style="text-align:center">LEVEL ' + level + ' &middot; REKORD ' + best + '</p>';
    playBtn.textContent = 'IGEN!';
    overlay.hidden = false;
    say('OWARI...');
    arp([7, 5, 3, 0], 110);
    vibrate([20, 60, 20]);
  }

  // Tap-hjælper: virker med både pointer og klik (nogle previews sluger det ene)
  function onTap(el, fn) {
    var last = 0;
    function h(e) {
      var n = Date.now();
      if (n - last < 450) return;
      last = n;
      fn(e);
    }
    el.addEventListener('click', h);
    el.addEventListener('pointerup', h);
  }
  onTap(playBtn, startGame);
  onTap(shuffleBtn, doShuffle);
  var armed = false, armT = null;
  onTap($('restartBtn'), function () {
    if (running && score > 0 && !armed) {          // to tryk for at undgå uheld (confirm() virker ikke i alle previews)
      armed = true; say('TRYK IGEN FOR NYT SPIL');
      clearTimeout(armT); armT = setTimeout(function () { armed = false; }, 2200);
      return;
    }
    armed = false; startGame();
  });
  onTap(soundBtn, function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    try { localStorage.setItem('harbuzoo.sound', soundOn ? 'on' : 'off'); } catch (e) {}
    if (soundOn) beep(760, .1, .05);
  });

  window.addEventListener('resize', function () { drawBg(); layout(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { drawBg(); layout(); }, 150); });
  document.addEventListener('visibilitychange', function () { lastTick = 0; idleSince = performance.now(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
      });
    }
  } catch (e) {}

  // ====================== Init ======================
  drawBg();
  makePetals();
  spriteCanvas(SPRITES[1], 1, mascot);
  spriteCanvas(SPRITES[1], 6, $('bigMascot'));
  updateShuffleUI();
  fillBoard();
  layout();
  setTimeout(layout, 300);   // efter skrifttype/layout har sat sig

  if (/[?&]debug/.test(location.search)) {
    window.__zoo = {
      board: function () { return board; },
      setType: function (i, type) { var t = board[i]; t.type = type; t.special = null; paint(t); },
      swap: function (i, j) { return trySwap(i, j); },
      setSpecial: function (i, kind) { var t = board[i]; t.special = kind; if (kind === 'rainbow') t.type = -1; paint(t); },
      state: function () { return { score: score, level: level, shuffles: shuffles, busy: busy, running: running }; }
    };
  }
})();
</script>
</body>
</html>
