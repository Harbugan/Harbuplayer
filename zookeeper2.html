<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>HarbuZoo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a2e">
<meta name="description" content="HarbuZoo - pixelart match-3 dyrespil med uendelig sti, forhindringer og chiptune-musik.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HarbuZoo">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23120a2e'/%3E%3Ccircle cx='90' cy='100' r='56' fill='%23e8334a'/%3E%3Ctext x='90' y='122' font-size='72' text-anchor='middle'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --ink: #1b1030; --cream: #fff3d6; --red: #e8334a; --gold: #ffd23f;
    --pink: #ff9db5; --cyan: #36e0ff; --lime: #9dff4a; --panel: #2a1a52; --panel2: #35216a;
    --cs: 40px; --sp: 36px;
    --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    --font: "Press Start 2P", ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
    background: #120a2e; color: var(--cream); font-family: var(--font); font-size: 10px; line-height: 1.5;
    -webkit-user-select: none; user-select: none;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .petal { position: absolute; top: -12px; width: 6px; height: 6px; background: var(--pink); box-shadow: 2px 2px 0 rgba(0,0,0,.25); opacity: .85; animation: fall linear infinite; }
  @keyframes fall { 0% { transform: translate(0,0); } 50% { transform: translate(28px, 55vh); } 100% { transform: translate(-10px, 112vh); } }

  .app { position: relative; z-index: 2; width: 100%; max-width: 440px; height: 100%; margin: 0 auto;
    display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 8px); }
  header { display: flex; align-items: center; gap: 8px; flex: none; }
  .mascot { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
  .mascot.hop { animation: hop .35s steps(4); }
  @keyframes hop { 40% { transform: translateY(-8px) rotate(-6deg); } 100% { transform: none; } }
  .hd { flex: 1; min-width: 0; }
  .brand { font-size: 14px; text-shadow: 2px 2px 0 var(--ink); letter-spacing: 1px; white-space: nowrap; }
  .brand span { color: var(--red); }
  .bubble { margin-top: 4px; display: block; width: fit-content; max-width: 100%; background: var(--cream); color: var(--ink);
    font-size: 7px; padding: 4px 6px; border: 2px solid var(--ink); box-shadow: 2px 2px 0 rgba(0,0,0,.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbtn { font-family: var(--font); color: var(--cream); cursor: pointer; background: var(--panel2);
    border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 4px 0 var(--ink); }
  .pbtn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 1px 0 var(--ink); }
  .pbtn.sq { width: 38px; height: 38px; font-size: 13px; padding: 0; line-height: 1; flex: none; }
  .pbtn.sq.txt { font-size: 7px; }
  .pbtn[aria-pressed="false"] { opacity: .5; }

  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }

  /* ---------- Kort ---------- */
  .maptop { display: flex; gap: 8px; margin: 10px 0 8px; flex: none; }
  .chip { flex: 1; text-align: center; padding: 6px 4px 5px; background: var(--panel); border: 3px solid var(--ink);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 3px 0 var(--ink); }
  .chip b { display: block; font-size: 12px; font-weight: normal; color: var(--gold); }
  .chip i { font-style: normal; font-size: 6px; letter-spacing: 1px; color: var(--pink); }
  #mapScroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); background: #140c33; }
  #mapInner { position: relative; }
  #mapCanvas { display: block; width: 100%; image-rendering: pixelated; }
  #car { position: absolute; left: 0; top: 0; image-rendering: pixelated; pointer-events: none; z-index: 3;
    transform-origin: 50% 100%; animation: bob .45s steps(2) infinite; }
  @keyframes bob { 50% { margin-top: -2px; } }
  .puff { position: absolute; z-index: 2; background: rgba(255,243,214,.75); pointer-events: none; animation: puff .6s steps(4) forwards; }
  @keyframes puff { to { transform: translate(-8px,-10px) scale(2); opacity: 0; } }
  .maphint { flex: none; text-align: center; font-size: 7px; color: var(--pink); padding-top: 8px; }

  /* ---------- Match-3 ---------- */
  .stats { display: flex; gap: 8px; margin: 10px 0 8px; flex: none; }
  .stat { flex: 1; text-align: center; padding: 6px 4px 5px; background: var(--panel); border: 3px solid var(--ink);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 3px 0 var(--ink); }
  .stat b { display: block; font-size: 12px; font-weight: normal; color: var(--gold); }
  .stat i { font-style: normal; font-size: 6px; letter-spacing: 1px; color: var(--pink); }
  .timer { height: 14px; background: var(--ink); border: 3px solid var(--ink); box-shadow: 0 0 0 2px rgba(255,255,255,.16); flex: none; }
  #timerFill { height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--lime) 0 6px, transparent 6px 8px); }
  .timer.low #timerFill { background: repeating-linear-gradient(90deg, var(--red) 0 6px, transparent 6px 8px); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .5; } }

  .goals { display: flex; justify-content: center; gap: 8px; margin: 9px 0 2px; flex: none; }
  .goal { display: flex; align-items: center; gap: 5px; padding: 4px 7px 4px 4px; background: var(--panel);
    border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
  .goal .gi { width: 22px; height: 22px; background-repeat: no-repeat; background-position: center;
    background-size: 22px 22px; image-rendering: pixelated; }
  .goal b { font-size: 10px; font-weight: normal; color: var(--cream); }
  .goal.done { border-color: var(--lime); }
  .goal.done b { color: var(--lime); }
  .goal.bump { animation: bump .25s steps(3); }
  @keyframes bump { 50% { transform: scale(1.22); } }

  .board-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #board { position: relative; box-sizing: content-box; width: calc(var(--cs) * 8); height: calc(var(--cs) * 8);
    border: 4px solid var(--red);
    box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--gold), 0 0 0 9px var(--ink), 0 12px 0 9px var(--ink), inset 0 0 0 2px rgba(0,0,0,.35);
    background-color: #241845;
    background-image: var(--boardbg, conic-gradient(#2d1f55 25%, #231745 0 50%, #2d1f55 0 75%, #231745 0));
    background-size: calc(var(--cs) * 2) calc(var(--cs) * 2); image-rendering: pixelated; touch-action: none; }
  #board.matsuri { animation: feverB .5s steps(4) infinite; }
  @keyframes feverB { 0% { border-color: #ff9db5; } 25% { border-color: #ffd23f; } 50% { border-color: #9dff4a; } 75% { border-color: #36e0ff; } }
  #board.shake { animation: bshake .28s steps(6); }
  @keyframes bshake { 20% { transform: translate(calc(var(--amp,4px) * -1), calc(var(--amp,4px) * .5)); }
    40% { transform: translate(var(--amp,4px), calc(var(--amp,4px) * -.5)); }
    60% { transform: translate(calc(var(--amp,4px) * -.75), calc(var(--amp,4px) * -.5)); }
    80% { transform: translate(calc(var(--amp,4px) * .75), calc(var(--amp,4px) * .5)); } }

  .tile { position: absolute; top: 0; left: 0; width: var(--cs); height: var(--cs); display: grid; place-items: center;
    z-index: 2; will-change: transform; transition: transform var(--mv, 100ms) var(--ez, cubic-bezier(.25,.9,.35,1)); }
  .tile > i { position: relative; display: block; width: calc(var(--cs) - 6px); height: calc(var(--cs) - 6px);
    background-repeat: no-repeat; background-position: center; background-size: var(--sp) var(--sp);
    image-rendering: pixelated; transition: transform .1s steps(2), opacity .12s steps(2); }
  .t0 { background-image: var(--s0); } .t1 { background-image: var(--s1); } .t2 { background-image: var(--s2); }
  .t3 { background-image: var(--s3); } .t4 { background-image: var(--s4); } .t5 { background-image: var(--s5); }
  .t6 { background-image: var(--s6); }
  .tile > i[class*="sp-"]::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background-repeat: no-repeat; background-position: center; background-size: var(--sp) var(--sp); image-rendering: pixelated; }
  .sp-row::after { background-image: var(--ic-row); }
  .sp-col::after { background-image: var(--ic-col); }
  .sp-bomb::after { background-image: var(--ic-bomb); }
  .sp-row, .sp-col, .sp-bomb { outline: 2px solid var(--glow); outline-offset: -1px; animation: glow .7s steps(2) infinite; }
  .sp-row { --glow: var(--cyan); } .sp-col { --glow: var(--lime); } .sp-bomb { --glow: var(--red); }
  /* specialbrikker fortæller selv hvad de gør: pilene glider, bomben pulserer */
  .sp-row::after { animation: nudgeX .5s steps(2) infinite; } .sp-col::after { animation: nudgeY .5s steps(2) infinite; }
  .sp-bomb::after { animation: pulseB .5s steps(2) infinite; }
  @keyframes nudgeX { 50% { translate: 2px 0; } } @keyframes nudgeY { 50% { translate: 0 2px; } } @keyframes pulseB { 50% { scale: 1.12; } }
  @keyframes glow { 50% { outline-color: #fff; filter: brightness(1.35); } }
  .sp-rainbow { background-image: var(--orb); animation: hue 1.1s steps(8) infinite, bob2 .6s steps(2) infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  @keyframes bob2 { 50% { transform: scale(1.1); } }
  .born { animation: born .3s steps(5); }
  @keyframes born { 0% { transform: scale(2.2); filter: brightness(3); } 100% { transform: none; } }
  .tile > i:not([class*="sp-"]) { filter: drop-shadow(0 3px 0 rgba(0,0,0,.3));
    animation: breathe 1.8s steps(2) infinite; animation-delay: calc(var(--n, 0) * -.14s); }
  @keyframes breathe { 50% { translate: 0 -2px; } }
  .tile.sel > i { transform: scale(1.12); outline: 3px solid var(--gold); outline-offset: -1px; }
  .tile.hint > i { animation: hintA .6s steps(2) infinite; }
  @keyframes hintA { 50% { transform: scale(1.14); } }
  /* landing squash, idle twitch and pop: på det indre element, så brikkens position aldrig påvirkes */
  .tile.land > i:not([class*="zz"]) { animation: landA .16s steps(3); }
  @keyframes landA { 0% { transform: scale(1.14,.82); } 60% { transform: scale(.95,1.08); } 100% { transform: none; } }
  .tile.twitch > i:not([class*="zz"]) { animation: twitchA .45s steps(5); }
  @keyframes twitchA { 20% { transform: translateY(-4px) rotate(-7deg); } 45% { transform: translateY(-2px) rotate(7deg); } 70% { transform: translateY(-3px) rotate(-3deg); } 100% { transform: none; } }
  .tile.pop > i:not([class*="zz"]) { animation: popA var(--pop, 130ms) steps(4) forwards; }
  @keyframes popA { 0% { transform: scale(1.25,.8); filter: brightness(2.2); }
    35% { transform: scale(.85,1.22); filter: brightness(1.7); }
    100% { transform: scale(.15) rotate(20deg); opacity: 0; filter: brightness(1); } }
  .tile.bad { animation: shake .2s steps(4); }
  @keyframes shake { 25% { margin-left: -4px; } 75% { margin-left: 4px; } }

  .fx { position: absolute; pointer-events: none; z-index: 5; text-align: center; white-space: nowrap;
    font-size: 9px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink); animation: fx .8s steps(8) forwards; }
  @keyframes fx { to { transform: translateY(-34px); opacity: 0; } }
  .beam { position: absolute; pointer-events: none; z-index: 4; animation: beam .45s steps(6) forwards; }
  .beam.h { background: linear-gradient(var(--cyan), #fff, var(--cyan)); }
  .beam.v { background: linear-gradient(90deg, var(--lime), #fff, var(--lime)); animation-name: beamv; }
  @keyframes beam { 0% { opacity: 1; } 100% { opacity: 0; transform: scale(1,.2); } }
  @keyframes beamv { 0% { opacity: 1; } 100% { opacity: 0; transform: scale(.2,1); } }
  .ring { position: absolute; pointer-events: none; z-index: 4; border: 4px solid var(--gold);
    background: rgba(232,51,74,.45); animation: ring .5s steps(6) forwards; }
  @keyframes ring { 0% { transform: translate(-50%,-50%) rotate(45deg) scale(.2); opacity: 1; } 100% { transform: translate(-50%,-50%) rotate(45deg) scale(1); opacity: 0; } }

  .bottom { display: flex; align-items: center; gap: 10px; padding-top: 10px; flex: none; }
  #shuffleBtn { flex: none; padding: 10px 11px; font-size: 9px; background: var(--red); display: flex; align-items: center; gap: 7px; }
  #shuffleBtn b { background: var(--ink); color: var(--gold); padding: 3px 5px; font-weight: normal; }
  #shuffleBtn:disabled { filter: grayscale(1); opacity: .5; }
  .small { font-size: 7px; text-shadow: 1px 1px 0 var(--ink); line-height: 1.7; }

  /* ---------- Forhindringer ---------- */
  .tile > i.lk1::after, .tile > i.lk2::after { content: ''; position: absolute; inset: -1px; pointer-events: none; }
  .tile > i.lk2::after { background: linear-gradient(135deg, rgba(255,255,255,.6) 0 14%, rgba(127,208,255,.4) 14% 100%);
    border: 3px solid #bff3ff; box-shadow: inset 0 0 0 2px #4fa8ee, 0 0 0 1px var(--ink); }
  .tile > i.lk1::after { background: linear-gradient(135deg, rgba(255,255,255,.5) 0 12%, rgba(127,208,255,.22) 12% 100%),
      linear-gradient(45deg, transparent 46%, rgba(255,255,255,.55) 46% 54%, transparent 54%);
    border: 2px solid #bff3ff; box-shadow: 0 0 0 1px var(--ink); }
  .tile > i.rock.rk2 { background-image: var(--rock2); }
  .tile > i.rock.rk1 { background-image: var(--rock1); }
  .tile > i.hitfx { animation: hitfx .3s steps(3); }
  @keyframes hitfx { 50% { filter: brightness(2.4); transform: scale(1.18); } }

  /* ---------- Overlay ---------- */
  #overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px; background: rgba(10,5,28,.84); }
  #overlay[hidden] { display: none; }
  .card { width: 100%; max-width: 360px; max-height: 94vh; overflow-y: auto; text-align: center; padding: 18px 16px;
    background: var(--panel); border: 4px solid var(--ink); box-shadow: inset 0 0 0 3px var(--red), 0 6px 0 var(--ink); }
  .card canvas.big-m { width: 64px; height: 64px; image-rendering: pixelated; }
  .card h1 { margin: 6px 0 2px; font-size: 17px; font-weight: normal; text-shadow: 3px 3px 0 var(--ink); }
  .card h1 span { color: var(--red); }
  .jp { font-size: 10px; color: var(--pink); margin-bottom: 10px; font-family: "Hiragino Sans", "Noto Sans JP", var(--font); }
  .big { font-size: 24px; color: var(--gold); margin: 4px 0 8px; text-shadow: 3px 3px 0 var(--ink); }
  .stars { font-size: 20px; letter-spacing: 6px; color: var(--gold); margin: 2px 0 8px; text-shadow: 2px 2px 0 var(--ink); }
  .stars .off { color: #4a3a73; }
  .rules { text-align: left; font-size: 7px; line-height: 2; margin: 0 0 12px; }
  .rules p { margin: 0 0 6px; }
  .c1 { color: var(--cyan); } .c2 { color: var(--red); } .c3 { color: var(--gold); } .c4 { color: var(--lime); }
  .goalrow { display: flex; justify-content: center; gap: 10px; margin: 8px 0 12px; }
  .goalrow .g { display: flex; align-items: center; gap: 5px; background: var(--ink); padding: 5px 8px 5px 5px; }
  .goalrow .gi { width: 24px; height: 24px; background-repeat: no-repeat; background-position: center; background-size: 24px 24px; image-rendering: pixelated; }
  button.play { width: 100%; padding: 13px 8px; font-size: 11px; color: var(--ink); background: var(--gold);
    border: 3px solid var(--ink); cursor: pointer; font-family: var(--font); box-shadow: inset 0 0 0 2px #fff6, 0 4px 0 var(--ink); }
  button.play:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px #fff6, 0 1px 0 var(--ink); }
  button.alt { background: var(--panel2); color: var(--cream); margin-top: 8px; }

  /* ---------- Pynt ---------- */
  #garland { position: fixed; top: 0; left: 0; width: 100%; image-rendering: pixelated; z-index: 1; pointer-events: none;
    animation: flick 1.6s steps(2) infinite; }
  @keyframes flick { 50% { filter: brightness(1.25) saturate(1.2); } }
  .cloud { position: fixed; z-index: 0; image-rendering: pixelated; pointer-events: none; opacity: .55; animation: drift linear infinite; left: -200px; }
  @keyframes drift { to { transform: translateX(calc(100vw + 420px)); } }
  #fxCv { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; z-index: 11; }
  .brand small { font-family: var(--jp); font-size: 9px; font-weight: 900; color: var(--gold); margin-left: 6px; letter-spacing: 0; text-shadow: 1px 1px 0 var(--ink); }

  .meters { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex: none; }
  .fever { position: relative; flex: 1; height: 16px; background: var(--ink); border: 3px solid var(--ink);
    box-shadow: 0 0 0 2px rgba(255,255,255,.16); overflow: hidden; }
  .fever i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .25s steps(4);
    background: repeating-linear-gradient(90deg, #ff9db5 0 6px, #ffd23f 6px 8px); }
  .fever span { position: relative; z-index: 1; display: block; text-align: center; font-size: 7px; line-height: 10px; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .fever.on i { background: repeating-linear-gradient(90deg, #ff9db5 0 6px, #ffd23f 6px 12px, #9dff4a 12px 18px, #36e0ff 18px 24px);
    animation: marq .4s steps(4) infinite; transition: none; }
  .fever.on span { animation: blink .3s steps(2) infinite; }
  @keyframes marq { to { background-position: 24px 0; } }
  .streak { flex: none; min-width: 84px; text-align: center; font-size: 7px; padding: 4px 6px; background: var(--panel);
    border: 2px solid var(--ink); color: var(--pink); box-shadow: 0 2px 0 var(--ink); }
  .streak.hot { color: var(--gold); border-color: var(--gold); animation: bump .25s steps(3); }

  .stamp { position: absolute; left: 50%; top: 42%; z-index: 7; text-align: center; white-space: nowrap; pointer-events: none;
    transform: translate(-50%, -50%) rotate(-5deg); animation: stamp 1s steps(10) forwards; }
  .stamp .k { font-family: var(--jp); font-weight: 900; font-size: 38px; line-height: 1.1; color: #fff3d6; letter-spacing: 2px;
    text-shadow: 3px 3px 0 var(--red), 5px 5px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
  .stamp .t { margin-top: 4px; font-size: 11px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); }
  .stamp.gold .k { color: var(--gold); text-shadow: 3px 3px 0 #b3401a, 5px 5px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
  .stamp.cyan .k { color: #c8f6ff; text-shadow: 3px 3px 0 #1f7ab3, 5px 5px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
  @keyframes stamp { 0% { transform: translate(-50%,-50%) rotate(-5deg) scale(2.6); opacity: 0; }
    14% { transform: translate(-50%,-50%) rotate(-5deg) scale(1); opacity: 1; }
    26% { transform: translate(-50%,-50%) rotate(-5deg) scale(1.12); }
    34% { transform: translate(-50%,-50%) rotate(-5deg) scale(1); }
    80% { opacity: 1; } 100% { transform: translate(-50%,-90%) rotate(-5deg); opacity: 0; } }

  .card { background-color: var(--panel); background-image: var(--wave, none); background-size: 64px 64px; image-rendering: auto;
    padding: 22px 18px;
    box-shadow: inset 0 0 0 3px var(--red), inset 0 0 0 5px var(--gold), inset 0 0 0 7px var(--ink), 0 6px 0 var(--ink); }
  .card .kanji { font-family: var(--jp); font-weight: 900; font-size: 26px; letter-spacing: 6px; color: var(--gold);
    text-shadow: 3px 3px 0 var(--red), 5px 5px 0 var(--ink); margin: 2px 0 6px; }
  .stars span { display: inline-block; animation: starpop .55s steps(6) both; }
  .stars span:nth-child(2) { animation-delay: .22s; } .stars span:nth-child(3) { animation-delay: .44s; }
  @keyframes starpop { 0% { transform: scale(0) rotate(-120deg); opacity: 0; } 65% { transform: scale(1.7) rotate(15deg); opacity: 1; } 100% { transform: none; } }
  button.play { background: linear-gradient(#ffe27a, var(--gold)); }

  /* ---------- 2.0: feedback og læsbarhed ---------- */
  .fx.neg { color: #ff6b7f; font-size: 8px; }
  .bflash { position: absolute; inset: 0; z-index: 6; pointer-events: none; animation: bfl .12s steps(3) forwards; }
  @keyframes bfl { to { opacity: 0; } }
  .stamp.sm { top: 9%; animation-duration: .75s; }

    if (tok !== sess) return;
    busy = false;
    if (goalsDone()) levelWin();
    drainPending();
  }
  // Ét-træks input-buffer: et sving/tryk under en kæde huskes (kun det seneste) og udføres, når brættet er faldet til ro.
  // Det valideres igen på det rolige bræt og udløber efter BUFFER_MS, så det aldrig giver uventede bytter.
  function queueMove(i, j) { pending = { i: i, j: j, at: performance.now() }; }
  function drainPending() {
    var p = pending; pending = null;
    if (!p || !running || ended || busy) return;
    if (performance.now() - p.at > BUFFER_MS) return;
    if (p.j === undefined) { select(p.i); return; }
    trySwap(p.i, p.j);
  }
  function neighbors(i, j) {
    var r1 = Math.floor(i / SIZE), c1 = i % SIZE, r2 = Math.floor(j / SIZE), c2 = j % SIZE;
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  }

  var down = null;
  function cellFromEvent(e) {
    var rect = boardEl.getBoundingClientRect(), cs = cell();
    var c = Math.floor((e.clientX - rect.left - boardEl.clientLeft) / cs);
    var r = Math.floor((e.clientY - rect.top - boardEl.clientTop) / cs);
    if (r < 0 || c < 0 || r >= SIZE || c >= SIZE) return -1;
    return idx(r, c);
  }
  function select(i) {
    clearSelection();
    if (i < 0 || !board[i]) return;
    if (board[i].lock) { flashBad(board[i]); return; }
    selected = i; board[i].el.classList.add('sel');
    SFX.select();
  }
  function flashBad(t) {
    t.el.classList.remove('bad'); void t.el.offsetWidth; t.el.classList.add('bad');
    SFX.locked();
    setTimeout(function () { t.el.classList.remove('bad'); }, 300);
  }
  function clearSelection() { if (selected !== null && board[selected]) board[selected].el.classList.remove('sel'); selected = null; }
  boardEl.addEventListener('pointerdown', function (e) {
    if (!running || ended) return;
    var i = cellFromEvent(e);
    if (i < 0) return;
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
    down = { i: i, x: e.clientX, y: e.clientY, moved: false, wasSel: selected === i };
    if (!busy && selected === null) select(i);
    e.preventDefault();
  });
  boardEl.addEventListener('pointermove', function (e) {
    if (!down || down.moved) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y, thresh = cell() * 0.45;
    if (Math.abs(dx) < thresh && Math.abs(dy) < thresh) return;
    down.moved = true;
    var r = Math.floor(down.i / SIZE), c = down.i % SIZE, from = down.i;
    if (Math.abs(dx) > Math.abs(dy)) c += dx > 0 ? 1 : -1; else r += dy > 0 ? 1 : -1;
    clearSelection();
    if (r >= 0 && c >= 0 && r < SIZE && c < SIZE) {
      if (busy) { queueMove(from, idx(r, c)); SFX.select(); }      // brættet løser sig: husk træk
      else trySwap(from, idx(r, c));
    }
    down = null;
  });
  boardEl.addEventListener('pointerup', function (e) {
    if (!down) return;
    var i = cellFromEvent(e);
    if (!down.moved && i >= 0) {
      if (busy) {                                                   // to tryk under en kæde = et buffer-træk
        if (pending && pending.j === undefined && pending.i !== i && neighbors(pending.i, i)) { queueMove(pending.i, i); SFX.select(); }
        else pending = { i: i, j: undefined, at: performance.now() };
      }
      else if (selected !== null && selected !== i && neighbors(selected, i)) { var from = selected; clearSelection(); trySwap(from, i); }
      else if (selected === i && down.wasSel && down.i === i) clearSelection();     // tryk igen = fravælg
      else if (selected !== i) select(i);
    }
    down = null;
  });
  boardEl.addEventListener('pointercancel', function () { down = null; });
  function clearHint() { hintTiles.forEach(function (t) { if (t && t.el) t.el.classList.remove('hint'); }); hintTiles = []; }
  function showHint() {
    if (hintTiles.length || busy) return;
    var mv = findMove();
    if (!mv) return;
    hintTiles = [board[mv[0]], board[mv[1]]];
    hintTiles.forEach(function (t) { if (t && t.el) t.el.classList.add('hint'); });
  }

  function startLevel(nd) {
    var n = nd.n;
    curNode = nd; levelN = n; cfg = levelConfig(nd);
    score = 0; timeLeft = TIME_START;
    shuffles = SHUFFLE_START; nextShuffleAt = SHUFFLE_EVERY;
    sess++; pending = null; down = null;
    ended = false; busy = false;
    scoreEl.textContent = '0'; levelNEl.textContent = n; bestEl.textContent = save.best;
    updateShuffleUI(); clearSelection(); clearHint(); resetMeters();
    showScreen('game');
    fillBoard(); renderGoals(); layout();
    running = true; lastTick = 0; idleSince = performance.now();
    say('HAJIME! BANE ' + n);
    arp([0, 2, 4], 70, 'triangle', .04);
  }
  function abortLevel() {                          // forlad banen midt i en kæde uden at efterlade levende async-kald
    sess++; running = false; ended = true; busy = false; pending = null; down = null;
    clearSelection(); clearHint();
  }
  function starsFor(sc) { return sc >= cfg.target * 2.0 ? 3 : (sc >= cfg.target * 1.3 ? 2 : 1); }
  function levelWin() {
    if (ended) return;
    ended = true; running = false; pending = null;
    clearSelection(); clearHint();
    var nd = curNode, st = starsFor(score), firstClear = !save.done[nd.id];
    save.done[nd.id] = Math.max(save.done[nd.id] || 0, st);
    save.total += score;
    if (score > save.best) save.best = score;
    genRows(nd.r + AHEAD + 1);
    persist();
    fever.on = false; boardEl.classList.remove('matsuri'); hanabiShow(6);
    var forks = nd.children.length > 1;
    say('YATTA!'); SFX.win(); vibrate([20, 40, 20]);
    card('<h1>KLARET!</h1><div class="jp">やったー!</div>' + starsHtml(st) +
      '<div class="big">' + score + '</div>' +
      '<div class="rules"><p>BANE ' + nd.n + (firstClear ? '<br>' + (forks ? 'STIEN GRENER! VÆLG VEJ.' : 'NÆSTE BANE ER ÅBEN!') : '') + '</p></div>' +
      '<button class="play" id="cGo">VIDERE</button>');
    bindCard('cGo', function () {
      closeCard();
      showScreen('map');
      if (!firstClear) return;
      var open = nd.children.map(function (id) { return nodeById[id]; }).filter(function (o) { return nodeState(o) === 'open'; });
      if (open.length === 1) {                           // kun én vej: bilen kører selv videre
        save.pos = open[0].id; persist();
        setTimeout(function () { carAt(nd.x, yOf(nd)); scrollToCar(false); driveTo(nd, open[0], refreshMapHud); }, 80);
      } else if (open.length > 1) setTimeout(function () { say('VÆLG EN STI!'); }, 200);
    });
  }
  function levelFail() {
    if (ended) return;
    ended = true; running = false; pending = null;
    clearSelection(); clearHint();
    var left = cfg.goals.reduce(function (a, g) { return a + Math.max(0, g.need - g.got); }, 0);
    fever.on = false; boardEl.classList.remove('matsuri');
    say('OWARI...'); SFX.lose(); vibrate([20, 60, 20]);
    card('<h1>TIDEN ER UDE</h1><div class="jp">時間切れ</div>' +
      '<div class="big">' + score + '</div>' +
      '<div class="rules"><p>DER MANGLEDE ' + left + (cfg.goals.some(function (g) { return g.type === 'obst'; }) ? ' STK.' : ' DYR') + '</p></div>' +
      '<button class="play" id="cGo">PRØV IGEN</button><button class="play alt" id="cBack">KORT</button>');
    bindCard('cGo', function () { closeCard(); startLevel(curNode); });
    bindCard('cBack', function () { closeCard(); showScreen('map'); });
  }

  // ====================== Hovedloop (match-3 tid) ======================
  function idleTwitch(now) {                       // små, sjældne bevægelser: dyrene lever, men brættet forbliver læseligt
    twitchAt = now + 1800 + Math.random() * 1600;
    var t = board[Math.floor(Math.random() * board.length)];
    if (!t || t.type < 0 || t.lock || t.special) return;
    t.el.classList.add('twitch');
    setTimeout(function () { t.el.classList.remove('twitch'); }, 480);
  }
  function loop(now) {
    requestAnimationFrame(loop);
    // pause: kort åbent, fane skjult eller ikke i spil. Intet ur løber, ingen streak eller MATSURI forsvinder
    if (!running || screen !== 'game' || !overlay.hidden || document.hidden) { lastTick = 0; return; }
    if (!lastTick) lastTick = now;
    var dt = Math.min(0.25, (now - lastTick) / 1000);
    lastTick = now;
    if (!busy) {
      if (!fever.on) timeLeft -= dt * cfg.drain;                     // tiden står stille under MATSURI
      if (now - idleSince > 5000) showHint();
      if (streak) { streakT -= dt; if (streakT <= 0) { streak = 0; streakT = 0; updateMeters(); } }
      if (now > twitchAt) idleTwitch(now);
    }
    streakEl.style.setProperty('--sk', streak ? Math.max(0, streakT / (STREAK_MS / 1000) * 100).toFixed(0) + '%' : '0%');
    if (fever.on) {
      fever.t -= dt;
      if (fever.t <= 0) endFever(); else feverFill.style.width = (fever.t / FEVER_LEN * 100).toFixed(1) + '%';
    }
    if (timeLeft <= 0 && !busy) { timeLeft = 0; levelFail(); }     // aldrig midt i en kæde
    var frac = Math.max(0, timeLeft) / TIME_MAX;
    fillEl.style.width = (frac * 100).toFixed(1) + '%';
    timerEl.classList.toggle('low', frac < 0.25);
  }
  requestAnimationFrame(loop);

  // ====================== Knapper ======================
  function onTap(el, fn) {
    var last = 0;
    function h(e) { var n = Date.now(); if (n - last < 450) return; last = n; fn(e); }
    el.addEventListener('click', h);
    el.addEventListener('pointerup', h);
  }
  onTap(shuffleBtn, doShuffle);
  onTap(soundBtn, function () {
    soundOn = !soundOn;
    save.sound = soundOn; persist();
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (soundOn) beep(760, .1, .05);
  });
  onTap(musicBtn, function () {
    musicOn = !musicOn;
    save.music = musicOn; persist();
    musicBtn.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
    if (musicOn) startMusic(); else stopMusic();
  });
  onTap(mapBtn, function () {
    if (screen === 'game' && running && !ended) {
      card('<h1>FORLAD BANEN?</h1><div class="rules"><p>DINE POINT I DENNE BANE GÅR TABT.</p></div>' +
        '<button class="play" id="cGo">JA, TIL KORTET</button><button class="play alt" id="cBack">BLIV</button>');
      bindCard('cGo', function () { closeCard(); abortLevel(); showScreen('map'); });
      bindCard('cBack', closeCard);
      return;
    }
    if (screen === 'game') abortLevel();
    closeCard();
    showScreen('map');
  });

  window.addEventListener('resize', function () { drawBg(); drawGarland(); fxSize(); layout(); if (screen === 'map') drawMap(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { drawBg(); drawGarland(); fxSize(); layout(); if (screen === 'map') drawMap(); }, 150); });
  document.addEventListener('visibilitychange', function () { lastTick = 0; idleSince = performance.now();
    if (document.hidden) stopMusic(); else if (musicOn) startMusic();
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
      });
    }
  } catch (e) {}

  // ====================== Init ======================
  drawBg(); makePetals(); drawGarland(); makeClouds(); fxSize();
  root.style.setProperty('--boardbg', wavePattern('#2d1f55', '#231745', '#3d2b78', '#2e2062'));
  root.style.setProperty('--wave', wavePattern('#2a1a52', '#2d1d58', '#35246b', '#33226a'));
  spriteCanvas(SPRITES[1], 1, mascot);
  setSprites(3);
  resetPath();
  if (save.unlocked > 1 && !Object.keys(save.done).length) {     // gem fra den gamle, endelige bjergvej
    var oldStars = save.stars || {}, lim = save.unlocked - 1;
    genRows(lim + AHEAD);
    for (var lr = 0; lr < lim; lr++) rows[lr].nodes.forEach(function (nd) { save.done[nd.id] = oldStars[lr + 1] || 1; });
    save.pos = rows[lim].nodes[0].id;
  }
  delete save.unlocked; delete save.stars;
  if (!nodeById[save.pos]) save.pos = '0:0';
  showScreen('map');
  card('<canvas class="big-m" id="introM" width="72" height="72"></canvas>' +
    '<h1>HARBU<span>ZOO</span></h1><div class="kanji">動物園</div><div class="jp">どうぶつパズル</div>' +
    '<div class="rules"><p>KØR OP AD BJERGET. STIEN ER UENDELIG OG GRENER SIG UNDERVEJS: VÆLG SELV VEJ!</p>' +
    '<p>HVER BANE HAR ET <b class="c3">MÅL</b>: SAML X AF ET DYR FØR TIDEN LØBER UD.</p>' +
    '<p><b class="c1">4 I TRÆK</b> = KATANA &middot; <b class="c2">L/T</b> = BAKUDAN &middot; <b class="c3">5</b> = NIJI</p>' +
    '<p>BYT TO SPECIALBRIKKER FOR EN <b class="c3">MEGA-KOMBO</b>. KÆDER, <b class="c1">RENKA</b> (TRÆK I STRIBE) OG <b class="c2">MATSURI</b>-FESTEN GIVER FLERE POINT!</p>' +
    '<p>DYR I <b class="c1">GLAS</b> ER LÅST. LAV EN STRIBE VED SIDEN AF FOR AT BRYDE DET. JO HØJERE DU KOMMER, JO VANSKELIGERE BLIVER DET!</p></div>' +
    '<button class="play" id="cGo">TIL KORTET</button>');
  spriteCanvas(SPRITES[1], 6, $('introM'));
  bindCard('cGo', function () { closeCard(); showScreen('map'); });
  setTimeout(function () { drawMap(); scrollToCar(false); }, 120);

  if (/[?&]debug/.test(location.search)) {
    window.__zoo = {
      board: function () { return board; },
      cfg: function () { return cfg; },
      save: save,
      state: function () { return { screen: screen, score: score, levelN: levelN, shuffles: shuffles, busy: busy, running: running, ended: ended,
        goals: cfg ? cfg.goals.map(function (g) { return [g.type, g.got, g.need]; }) : null }; },
      setType: function (i, type) { var t = board[i]; t.type = type; t.special = null; paint(t); },
      setSpecial: function (i, kind) { var t = board[i]; t.special = kind; if (kind === 'rainbow') t.type = -1; paint(t); },
      swap: function (i, j) { return trySwap(i, j); },
      startLevel: startLevel, openLevel: openLevel, nodeById: function (id) { return nodeById[id]; }, nodeState: nodeState,
      rows: function () { return rows; }, levelConfig: levelConfig,
      setTime: function (t) { timeLeft = t; },
      carPos: function () { return { x: carEl._ux, y: carEl._uy }; },
      reset: function () { save.done = {}; save.pos = '0:0'; save.total = 0; persist(); drawMap(); refreshMapHud(); },
      // --- test-hooks (kun med ?debug) ---
      shuffleBoard: shuffleBoard, fillBoard: fillBoard, findMove: findMove, ensurePlayable: ensurePlayable,
      matches: function () { return findMatches().size; },
      pending: function () { return pending; }, sess: function () { return sess; }, abortLevel: abortLevel,
      swaps: function () { return swapCount; }, queueMove: queueMove, doShuffle: doShuffle, levelFail: levelFail,
      timers: function () { return { time: timeLeft, streak: streak, streakT: streakT, fever: fever.on, feverT: fever.t, feverV: fever.v }; },
      setFever: function (v) { fever.v = v; addFever(0); },
      setLock: function (i, hp, rock) { var t = board[i]; t.lock = hp; if (rock) { t.type = -2; t.special = null; } paint(t); },
      setLayout: function (types) { types.forEach(function (ty, i) { var t = board[i]; t.type = ty; t.special = null; t.lock = 0; paint(t); }); },
      consts: { SWAP_MS: SWAP_MS, POP_MS: POP_MS, FALL_MS: FALL_MS, BUFFER_MS: BUFFER_MS }
    };
  }
})();
</script>
</body>
